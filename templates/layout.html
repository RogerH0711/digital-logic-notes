<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{root}}assets/katex/katex.min.css">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="{{bodyClass}}">
  <header class="site-header">
    <a class="brand" href="{{root}}index.html">
      <svg class="brand-mark" viewBox="0 0 32 20" aria-hidden="true"><path d="M1 15h6V5h6v10h6V5h6v10h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="brand-title">{{siteTitle}}</span>
      <span class="brand-sub">{{siteSubtitle}}</span>
    </a>
    <button class="theme-toggle" type="button" aria-label="切換深色／淺色模式">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor"/></svg>
    </button>
  </header>
{{body}}
  <footer class="site-footer">
    <p>{{siteTitle}} · {{author}} · 內容以 Markdown 撰寫、依 <a href="{{repo}}/blob/{{branch}}/AGENTS.md">AGENTS.md</a> 規則自動產生</p>
    <p><a href="{{repo}}">GitHub</a>{{editLink}}</p>
  </footer>
  <script src="{{root}}assets/js/main.js" defer></script>
</body>
</html>
